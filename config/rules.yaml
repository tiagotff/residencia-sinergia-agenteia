# Parâmetros de regras de negócio da Sinergia.
# Alterar um limiar aqui não exige mudança de código; toda decisão registra a versão usada.
# Referências legais devem ser confirmadas com o jurídico antes do uso em produção.
version: "2026.10.4"

catalog:
  R01:
    agent: reception
    description: Tipo de documento deve estar na lista aceita
  R02:
    agent: reception
    description: Arquivo em formato aceito, legível e completo
  R03:
    agent: reception
    description: Entrega dentro do prazo da política interna ou convenção coletiva
  R04:
    agent: processing
    description: Campos obrigatórios presentes (colaborador, datas, dias, médico, CRM/UF, assinatura)
  R05:
    agent: processing
    description: Datas coerentes (fim >= início; emissão não posterior ao início além da tolerância)
  R06:
    agent: processing
    description: CRM ativo na consulta do CFM
  R07:
    agent: processing
    description: Sem sobreposição com outro afastamento do colaborador
  R08:
    agent: processing
    description: Confiança da extração acima do limiar; o agente nunca adivinha um campo
  R09:
    agent: processing
    description: CID só é registrado se constar no documento (Res. CFM 1.658/2002)
  R10:
    agent: processing
    description: Afastamento acima de 15 dias segue para o INSS (Lei 8.213/1991, art. 60)
  R11:
    agent: processing
    description: Mesma doença em até 60 dias somando mais de 15 dias (Decreto 3.048/1999, art. 75)
  A01:
    agent: monitoring
    description: Taxa de afastamento do setor acima da linha de base histórica do próprio setor
  A02:
    agent: monitoring
    description: Concentração de afastamentos de um mesmo grupo de CID num setor ou turno
  A03:
    agent: monitoring
    description: Função crítica com cobertura abaixo do mínimo na data
  A04:
    agent: monitoring
    description: Soma de dias pela mesma causa se aproximando de 15 em 60 dias (antecipa R11)
  A05:
    agent: monitoring
    description: Grupo com menos de N pessoas tem o alerta suprimido ou agregado no nível acima
  R12:
    agent: escalation
    description: Ausência de 30 dias ou mais exige exame de retorno antes de reassumir (NR-7, 7.5.9)
  R13:
    agent: escalation
    description: Indício de origem ocupacional segue ao SESMT para avaliar a CAT (decisão humana)

reception:
  accepted_document_types:
    - atestado_medico
    - declaracao_comparecimento
    - atestado_acompanhante
  accepted_mime_types:
    - application/pdf
    - image/jpeg
    - image/png
  max_file_size_mb: 10
  max_pdf_pages: 4
  min_image_width_px: 600
  min_image_height_px: 600
  min_image_contrast: 5.0      # desvio-padrão dos tons de cinza; abaixo disso a imagem está em branco
  min_image_sharpness: 4.0     # desvio-padrão das bordas; abaixo disso a foto está desfocada
  delivery_deadline_days: 2
  max_resubmission_attempts: 3

processing:
  required_fields:             # R04, por tipo de documento
    atestado_medico: [employee_name, start_date, days, doctor_name, crm_number, crm_uf, signed]
    declaracao_comparecimento: [employee_name, start_date, doctor_name, crm_number, crm_uf, signed]
    atestado_acompanhante: [employee_name, start_date, doctor_name, crm_number, crm_uf, signed]
  issue_after_start_tolerance_days: 1   # R05: emissão até N dias depois do início
  min_field_confidence: 0.8             # R08: confiança de cada campo extraído
  min_ocr_confidence: 0.6               # R08: confiança média da leitura por OCR
  inss_threshold_days: 15               # R10 e R11
  same_cause_window_days: 60            # R11

monitoring:
  min_group_size: 5             # A05: grupos menores são agregados ou suprimidos
  baseline_weeks: 8             # A01: semanas anteriores usadas na linha de base
  min_baseline_weeks: 4         # A01: mínimo de semanas com dados para comparar
  spike_std_factor: 2.0         # A01: alerta acima de média + k × desvio-padrão
  min_rate_increase: 0.02       # A01: alta mínima sobre a média (2 pontos percentuais)
  cid_window_days: 30           # A02: janela para contar casos do mesmo grupo de CID
  cid_min_cases: 3              # A02: pessoas distintas com o mesmo grupo de CID
  min_critical_coverage: 0.7    # A03: fração mínima da função crítica disponível
  same_cause_alert_days: 12     # A04: alerta preventivo a partir deste total de dias

escalation:
  # Destinos possíveis: rh_dp, sesmt, medico_trabalho, gestor.
  # Utilidade de cada alternativa (destino × urgência × nível de detalhe):
  #   U = w_competencia × competência do destino
  #       − w_privacidade × custo do nível de detalhe
  #       − w_urgencia × custo da urgência (interromper o trabalho da área)
  #       − w_prazo × gravidade × dias de atraso em relação ao prazo ÷ maior SLA
  # Recebem tarefa os destinos com U >= min_utility; a de maior U é a principal.
  min_utility: 0.5
  weights:
    competence: 1.0
    privacy: 0.3
    urgency: 0.2
    deadline: 1.0
  urgencies:                    # SLA = dias para a área agir depois da confirmação humana
    baixa: {sla_days: 10, cost: 0.0}
    media: {sla_days: 5, cost: 0.1}
    alta: {sla_days: 2, cost: 0.25}
    critica: {sla_days: 1, cost: 0.5}
  detail_levels:                # do menos ao mais identificável
    agregado: 0.0
    pseudonimizado: 0.3
    individual: 0.6
  health_destinations: [sesmt, medico_trabalho]   # únicos que veem CID
  return_exam_min_days: 30      # R12: NR-7, item 7.5.9
  occupational_cid_prefixes: [S, T, Z57]  # R13: lesões, envenenamentos e exposição ocupacional (validar com o médico do trabalho)
  chain:                        # quem recebe quando o prazo vence sem resposta
    rh_dp: coordenacao_rh
    sesmt: coordenacao_sesmt
    medico_trabalho: coordenacao_sesmt
    gestor: rh_dp
    coordenacao_rh: coordenacao_rh
    coordenacao_sesmt: coordenacao_sesmt
  max_reescalations: 2
  demands:                      # por tipo de demanda: dado de saúde, detalhe mínimo, prazo e competências
    R10:
      title: Encaminhamento ao INSS
      health: false
      min_detail: individual
      severity: 1.0
      competence: {rh_dp: 1.0, gestor: 0.4, sesmt: 0.3, medico_trabalho: 0.3}
    R11:
      title: Mesma doença somando mais de 15 dias
      health: true
      min_detail: individual
      severity: 1.0
      default_deadline_days: 3
      competence: {rh_dp: 1.0, medico_trabalho: 0.9, sesmt: 0.4}
    R12:
      title: Exame de retorno ao trabalho
      health: false
      min_detail: individual
      severity: 0.8
      competence: {sesmt: 1.0, medico_trabalho: 0.8, gestor: 0.7, rh_dp: 0.5}
    R13:
      title: Indício de origem ocupacional (avaliar CAT)
      health: true
      min_detail: individual
      severity: 1.0
      default_deadline_days: 1
      competence: {sesmt: 1.0, medico_trabalho: 0.9, rh_dp: 0.3}
    A01:
      title: Pico de afastamentos no setor
      health: false
      min_detail: agregado
      severity: 0.5
      default_deadline_days: 5
      competence: {sesmt: 0.9, gestor: 0.8, rh_dp: 0.5, medico_trabalho: 0.4}
    A02:
      title: Mesmo grupo de CID concentrado (indício ocupacional, R13)
      health: true
      min_detail: agregado
      severity: 0.8
      default_deadline_days: 3
      competence: {sesmt: 1.0, medico_trabalho: 0.8, rh_dp: 0.2}
    A03:
      title: Cobertura baixa em função crítica
      health: false
      min_detail: agregado
      severity: 0.7
      default_deadline_days: 0
      competence: {gestor: 1.0, rh_dp: 0.6, sesmt: 0.1}
    A04:
      title: Mesma causa perto do limite do INSS
      health: true
      min_detail: pseudonimizado
      severity: 0.6
      default_deadline_days: 5
      competence: {medico_trabalho: 0.9, rh_dp: 0.7, sesmt: 0.5}
